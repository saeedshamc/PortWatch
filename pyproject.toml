[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portwatch"
dynamic = ["version"]
description = "Cross-platform port scanning toolkit: local listening sockets, async remote TCP scanning with banner grabbing, and scan diffing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saeed shamsi" }]
keywords = ["port", "scan", "network", "sockets", "asyncio", "security", "banner-grabbing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = ["psutil>=5.9.0"]

[project.scripts]
portwatch = "portwatch.cli:main"

[project.urls]
Homepage = "https://github.com/saeedshamc/PortWatch"
Repository = "https://github.com/saeedshamc/PortWatch"
Issues = "https://github.com/saeedshamc/PortWatch/issues"

[tool.setuptools]
packages = ["portwatch"]

[tool.setuptools.dynamic]
version = { attr = "portwatch.__version__" }

[tool.setuptools.package-data]
portwatch = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.mypy]
python_version = "3.10"
files = ["portwatch"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true
